paths:
  input_dir_SDS: ${oc.env:EHR_EXTRACT_DATA}/fetal_data/SDS_and_SP_from_population
  input_dir_SP: ${oc.env:EHR_EXTRACT_DATA}/fetal_data/SDS_and_SP_from_population
  population: ${paths.output_dir}/population_test_preterm.yaml.json
  output_dir: outputs 
  summary_save_path: ${paths.output_dir}/summary_${hydra:job.config_name}.csv
  table_save_path: ${paths.output_dir}/table_${hydra:job.config_name}.csv
  discards_save_path: ${paths.output_dir}/discards_${hydra:job.config_name}.json

strict: True 

summary_table: 
  make_table: True
  ignore_columns: [b_cpr, m_cpr, pregnancy_end, pregnancy_start]
  n_samples: null #100000

base_table: 
  population: ${paths.population}
  population_column: b_cpr
  tables:
    - table: 
        table1: ${paths.input_dir_SP}/Population.csv
        table2: ${paths.input_dir_SP}/Mor - Obstetrisk Historik DEL 2.csv
        left_on: [CPR_MOR]
        right_on: [MOR_CPR]
      columns: {CPR_MOR: m_cpr, CPR_BARN: b_cpr, Fødselstidspunkt: pregnancy_end, Gestationsalder: GA_weeks}
  key_columns: [b_cpr, m_cpr, GA_weeks, pregnancy_end]
  dtypes: {b_cpr: string, m_cpr: string, GA_weeks: string, pregnancy_end: date}
  add_columns:
    - column: GA_days
      function: find_GA_days
      args:
        GA_weeks_col: GA_weeks
        GA_days_col: GA_days
      dtype: integer
    - column: pregnancy_start
      function: find_pregnancy_start
      args:
        birth_date_col: pregnancy_end
        GA_days_col: GA_days
        pregnancy_start_col: pregnancy_start
      dtype: date
    - column: maternal_age
      function: find_maternal_age
      args:
        m_table_path: 
          table1: ${paths.input_dir_SP}/Population.csv
          table2: ${paths.input_dir_SP}/Mor - CPMI - Patientinfo.csv
          left_on: [CPR_MOR]
          right_on: [MOR_CPR]
        maternal_birth_date_col: Fødselsdato
        maternal_id_col: CPR_MOR
        baby_birth_date_col: pregnancy_start
        maternal_age_col: maternal_age
      dtype: integer

time_conditionals:
  before_pregnancy:
    min_date:
      date_col: null
      offset_days: 0
    max_date:
      date_col: pregnancy_start
      offset_days: -1
  during_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: 0
    max_date:
      date_col: pregnancy_end
      offset_days: 0
  year_before_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: -365
    max_date:
      date_col: pregnancy_start
      offset_days: 0


extract_criteria:
  - name: ethnicity
    key_column: m_cpr
    sources:
      - table: ${paths.input_dir_SP}/Mor - CPMI - Patientinfo.csv
        match_on: MOR_CPR
        column: Etnicitet
    dtype: string

conditional_bool_criteria: []

custom_extract_criteria:
   ## Obstetric history
  - name: parity
    key_column: b_cpr
    time_window: during_pregnancy
    function: filter_values
    args: 
      table: 
        table1: ${paths.input_dir_SP}/Mor - Obstetrisk Historik DEL 1.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [CPR_MOR]
      match_on: CPR_BARN
      target_col: Para
      new_col_name: current_parity
      date_col: "Kontakt dato"
      filters: 
        - column: Para 
          operator: "not_null"
          value: null
      dtype: integer

  ### Cervical conditions
  - name: cervical_length
    key_column: b_cpr
    time_window: during_pregnancy
    function: filter_values
    args:
        table: 
          table1: ${paths.input_dir_SP}/Mor - Yderligere variable vurderingsskema.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [CPR_MOR]
        match_on: CPR_BARN
        target_col: Værdi 
        new_col_name: current_cervical_length
        date_col: Registreringstidspunkt
        filters: 
          - column: Registrering
            operator: "=="
            value: "Cervix i mm"
        dtype: float
 
  ### Smoking status
  - name: smoking_status
    key_column: b_cpr
    time_window: before_pregnancy
    function: extract_latest_value
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - Patientinfo tillæg til CPMI.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [CPR_MOR]
      match_on: CPR_BARN
      target_col: "Alkohol - Antal ugentlige genstande"
      new_col_name: smoking_status
      date_col: "Dato for seneste opdatering"
      dtype: string
