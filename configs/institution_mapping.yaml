# Author: Karl van Eeden Risager
# Mapping: raw DICOM institution_name -> {region, site, department}.
#
# region/department left out of an entry (or an entry missing entirely)
# come out null. `site` is the one exception: it falls back to the raw
# institution_name value when the `site` key is left out entirely, so an
# entry only needs to set the fields it actually knows (e.g. just `region`)
# and can leave `site` to default on its own - but writing `site: null`
# explicitly keeps it null instead of falling back.


