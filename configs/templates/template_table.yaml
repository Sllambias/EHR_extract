# @package _global_
# Minimal table.py config: one wide feature row per subject, with one of each criteria block.
#   python EHR_extract/table.py --config-name template_table
# See docs/table.md
defaults:
  - /default
  - _self_

paths:
  input_dir_SP: ${oc.env:EHR_EXTRACT_DATA}/SP/tables
  # A population CSV, e.g. the output of extract.py.
  population: ${oc.env:EHR_EXTRACT_OUTPUTS}/populations/template_population/template_population_population_train_and_test.csv
  output_dir: ${oc.env:EHR_EXTRACT_OUTPUTS}/tables/${hydra:job.config_name}
  table_save_path: ${paths.output_dir}/table_${hydra:job.config_name}.csv
  summary_save_path: ${paths.output_dir}/summary_${hydra:job.config_name}.csv
  discards_save_path: ${paths.output_dir}/discards_${hydra:job.config_name}.json

strict: True
# Required key. True is the only value that currently runs; see README "Known limitations".
allow_duplicates: True

summary_table:
  # True requires a column literally named GA (table.py splits the summary at GA < 259).
  # This template produces GA_days / GA_weeks, so leave it False.
  make_table: False
  ignore_columns: [b_cpr, m_cpr, pregnancy_end, pregnancy_start]
  n_samples: 100000

base_table:
  population: ${paths.population}
  population_column: b_cpr
  tables:
    # A nested join spec: table1 is left-joined to table2 before the columns are selected.
    # `table:` may equally be a plain path string.
    - table:
        table1: ${paths.input_dir_SP}/Population.csv
        table2: ${paths.input_dir_SP}/Mor - Obstetrisk Historik DEL 2.csv
        left_on: [MOR_CPR, Fødselstidspunkt]
        right_on: [MOR_CPR, Dato]
      columns: {MOR_CPR: m_cpr, BABY_CPR: b_cpr, Fødselstidspunkt: pregnancy_end, Gestationsalder: GA_weeks}
  key_columns: [b_cpr, m_cpr, GA_weeks, pregnancy_end]
  dtypes: {b_cpr: string, m_cpr: string, GA_weeks: string, pregnancy_end: date}
  # Derived columns, computed in order. Rows that end up null are dropped and recorded in discards.
  add_columns:
    - column: GA_days
      function: find_GA_days
      args: {GA_weeks_col: GA_weeks, GA_days_col: GA_days}
      dtype: integer
    - column: pregnancy_start
      function: find_pregnancy_start
      args: {birth_date_col: pregnancy_end, GA_days_col: GA_days, pregnancy_start_col: pregnancy_start}
      dtype: date

# Named date windows, referenced by name from the criteria blocks below.
# date_col: null means "unbounded on this side".
time_conditionals:
  during_pregnancy:
    min_date: {date_col: pregnancy_start, offset_days: 0}
    max_date: {date_col: pregnancy_end, offset_days: 0}

# Take the latest value of a column and join it on as a new column.
extract_criteria:
  - name: ethnicity
    key_column: m_cpr
    dtype: string
    sources:
      - table: ${paths.input_dir_SP}/Mor - Patientinfo tillæg til CPMI.csv
        match_on: MOR_CPR
        column: Etnicitet
        date_col: "Dato for seneste opdatering"

# Add a boolean column: true when a matching row exists inside the time window.
conditional_bool_criteria:
  - name: smoking_status
    key_column: b_cpr
    match_on: m_cpr
    time_window: during_pregnancy
    conditions:
      - condition:  # null / and / or, same grouping rules as extract.py
        table:
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: startswith
        value: ["BKUA32"]
        date_col: Noteret_dato

# Required key. [] is valid; see docs/reference.md for the available functions.
custom_extract_criteria: []
