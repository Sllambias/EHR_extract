# @package _global_
# Minimal split_tables_on_hashes.py config: one .xlsx per patient for chart review.
#   python EHR_extract/split_tables_on_hashes.py --config-name template_split_tables
# Writes <patient_id>.xlsx with one worksheet per table. See docs/filter_tables.md
defaults:
  - /default
  - _self_

paths:
  input_dir_SP: ${oc.env:EHR_EXTRACT_DATA}/SP/tables
  output_dir: ${oc.env:EHR_EXTRACT_OUTPUTS}/tables_split/${hydra:job.config_name}
  population_table: ${oc.env:EHR_EXTRACT_OUTPUTS}/populations/template_population/template_population_population_train_and_test.csv

population_id_column: CPR_MOR
max_ids: 30  # export this many patients (seed 4215); null = all

# Named date windows, referenced by `time_window` below. A bound is a population_table date column,
# minus the days in `subtract_days_col` (optional), plus offset_days; date_col: null means
# "unbounded on this side". Here min_date is BIRTHDAY - GA, i.e. conception.
time_conditionals:
  pregnancy:
    min_date: {date_col: BIRTHDAY, subtract_days_col: GA, offset_days: 0}
    max_date: {date_col: BIRTHDAY, offset_days: 0}

# Unlike filter_tables_on_hashes.py, this script does read `time_col`, `columns`, `filters`
# and `time_window`.
tables:
  # columns omitted (null) = keep every column
  - table: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
    id_col: MOR_CPR
    time_col: Noteret_dato  # rows are sorted by this, newest first
    columns:
    # Optional: keep only rows passing every filter, dated inside the patient's window.
    filters:
      - {column: Diagnosekode, operator: startswith_any, value: ["DO"]}
    time_window: pregnancy
  # columns listed = keep only these, plus id_col and time_col
  - table: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
    id_col: MOR_CPR
    time_col: ServiceDatetime
    columns:
      - ProcedureCode
      - ProcedureName
