paths:
  input_dir_SDS: ${oc.env:EHR_EXTRACT_DATA}/fetal_data/SDS_and_SP_from_population
  input_dir_SP: ${oc.env:EHR_EXTRACT_DATA}/fetal_data/SDS_and_SP_from_population
  population: ${paths.output_dir}/population_test_preterm.yaml.json
  output_dir: outputs 
  summary_save_path: ${paths.output_dir}/summary_${hydra:job.config_name}.csv
  table_save_path: ${paths.output_dir}/table_${hydra:job.config_name}.csv
  discards_save_path: ${paths.output_dir}/discards_${hydra:job.config_name}.json

strict: True 

summary_table: 
  make_table: True
  ignore_columns: [b_cpr, m_cpr, pregnancy_end, pregnancy_start]
  n_samples: null #100000

base_table: 
  population: ${paths.population}
  population_column: b_cpr
  tables:
    - table: 
        table1: ${paths.input_dir_SP}/Population.csv
        table2: ${paths.input_dir_SP}/Mor - Obstetrisk Historik DEL 2.csv
        left_on: [CPR_MOR]
        right_on: [MOR_CPR]
      columns: {CPR_MOR: m_cpr, CPR_BARN: b_cpr, Fødselstidspunkt: pregnancy_end, Gestationsalder: GA_weeks}
  key_columns: [b_cpr, m_cpr, GA_weeks, pregnancy_end]
  dtypes: {b_cpr: string, m_cpr: string, GA_weeks: string, pregnancy_end: date}
  add_columns:
    - column: pregnancy_start
      function: find_pregnancy_start
      args:
        birth_date_col: pregnancy_end
        GA_days_col: GA_days
        pregnancy_start_col: pregnancy_start
      dtype: date

time_conditionals:
  during_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: 0
    max_date:
      date_col: pregnancy_end
      offset_days: 0



extract_info:
  - name: cervical_length
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
        table: 
          table1: ${paths.input_dir_SP}/Mor - Yderligere variable vurderingsskema.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [CPR_MOR]
        left_on: b_cpr
        right_on: CPR_BARN
        target_col: Værdi 
        new_col_name: current_cervical_length
        date_col: Registreringstidspunkt
        filters: 
          - column: Registrering
            operator: "=="
            value: "Cervix i mm"
        dtype: float
 
  - name: current_short_cervical_length
    time_window: during_pregnancy
    function: extract_filtered_conditional_values
    args:
        table: 
          table1: ${paths.input_dir_SP}/Mor - Yderligere variable vurderingsskema.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [CPR_MOR]
        key_column: b_cpr
        left_on: m_cpr
        right_on: MOR_CPR
        target_col: Værdi 
        new_col_name: current_short_cervical_length
        date_col: Registreringstidspunkt
        filters: 
          - column: Registrering
            operator: "=="
            value: "Cervix i mm"
        conditions:
          - condition:
            column: Værdi
            operator: "<"
            value: 25
        dtype: float

  - name: previous_short_cervical_length
    time_window: before_pregnancy
    function: extract_filtered_conditional_values
    args:
        table: 
          table1: ${paths.input_dir_SP}/Mor - Yderligere variable vurderingsskema.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [CPR_MOR]
        key_column: b_cpr
        left_on: m_cpr
        right_on: MOR_CPR
        target_col: Værdi 
        new_col_name: previous_short_cervical_length
        date_col: Registreringstidspunkt
        filters: 
          - column: Registrering
            operator: "=="
            value: "Cervix i mm"
        conditions: # in relation to target_col
          - condition:
            operator: "<"
            value: 25
        dtype: float

