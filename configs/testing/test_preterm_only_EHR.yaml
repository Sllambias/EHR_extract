# @package _global_
defaults:
  - /default@
  - _self_

paths:
  input_dir_SDS: /Users/zcr545/Desktop/Projects/repos/ehr2meds/data/raw/fetal_data/SDS_AND_SP_from_population
  input_dir_SP: /Users/zcr545/Desktop/Projects/repos/ehr2meds/data/raw/fetal_data/SDS_AND_SP_from_population
  output_dir: /Users/zcr545/Desktop/Projects/repos/EHR_extract/outputs/${hydra:job.config_name}
  population_save_path: ${paths.output_dir}/${hydra:job.config_name}_population
  discards_save_path: ${paths.output_dir}/${hydra:job.config_name}_discards
  distribution_save_path: ${paths.output_dir}/${hydra:job.config_name}_distribution
  holdout_csv: /Users/zcr545/Desktop/Projects/repos/EHR_extract/test_data/holdout.csv
  
strict: True 
prefix: /projects/users/data/UCPH/DeepFetal/ultrasound/PNG_processed_no_OCR/ # this should be deleted when splits are updated to include child CPR so we can match on that

population: 
  population_key: CPR_BARN
  split_key: CPR_MOR
  file_path_key: FILE_PATH
  tables: 
  composed_tables:
    - merge_on: CPR_BARN
      format_SP_GA: True
      tables:
        - table: ${paths.input_dir_SP}/Population.csv
          columns:
            CPR_BARN: BABY_CPR
            CPR_MOR: MOR_CPR
            BIRTHDAY: Fødselstidspunkt
        - table: ${paths.input_dir_SP}/Barn - Fødselsinfo.csv
          columns:
            CPR_BARN: BABY_CPR
            GA: Gestationsalder

conditional_criteria:
  # GA available at birth
  - action: include
    conditions: 
      - condition: 
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: GESTATIONSALDER_DAGE
        operator: "not_null"
        value: 
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Gestationsalder
        operator: "not_null"
        value: 
      - condition: 
        table: ${paths.input_dir_SP}/Barn - Fødselsinfo.csv
        match_on: BABY_CPR
        column: Gestationsalder
        operator: "not_null"
        value: 
  # Only first pregnancy
  - action: include
    conditions:
      - condition: 
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: PARITET
        operator: "=="
        value: "1"
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Paritet
        operator: "=="
        value: "1"
  # Only live birth (no SP)
  - action: exclude
    conditions:
      - condition: 
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: LEVENDE_ELLER_DOEDFOEDT
        operator: "!="
        value: Levendefødt
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: LevendefoedtDoedfoedt
        operator: "!="
        value: "1"
  # No C-section/kejsersnit (SP in custom criteria)
  - action: exclude
    conditions:
      - condition:
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Kejsersnit
        operator: "!="
        value: "-1"
      - condition: or
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: MARKOER_KEJSERSNIT
        operator: "=="
        value: "1"
  # Not induced (SP in custom criteria)
  - action: exclude
    conditions:
      - condition:
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: MARKOER_IGANGSAETTELSE
        operator: "=="
        value: "1"
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Igangsaettelse_Ballonkateter
        operator: "=="
        value: "Ja"
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Igangsaettelse_Medicinsk
        operator: "=="
        value: "Ja"
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Igangsaettelse_HSP
        operator: "=="
        value: "Ja"

custom_criteria:
  # C-section SP 
  - function: match_value_with_child_cpr_on_birthdate
    args:
      value: "KMCA00"
      operator: startswith
      value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
      value_column: ProcedureCode
      value_time_column: ServiceDatetime
      value_mother_cpr_column: MOR_CPR
      population_birth_column: BIRTHDAY
      population_gestational_age_column: GA
      population_child_cpr_column: CPR_BARN
      population_mother_cpr_column: CPR_MOR
    action: exclude
  # induction SP
  - function: match_value_with_child_cpr_on_birthdate
    args:
      value: ["KMAC00" , "KMAC96A", "BKHD2", "BKHD20"]
      operator: "=="
      value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
      value_column: ProcedureCode
      value_time_column: ServiceDatetime
      value_mother_cpr_column: MOR_CPR
      population_birth_column: BIRTHDAY
      population_gestational_age_column: GA
      population_child_cpr_column: CPR_BARN
      population_mother_cpr_column: CPR_MOR
    action: exclude
  # induction SP continued
  - function: match_value_with_child_cpr_on_birthdate
    args:
      value: ["DO837" , "DO847"]
      operator: startswith
      value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
      value_column: Diagnosekode
      value_time_column: Noteret_dato
      value_mother_cpr_column: MOR_CPR
      population_birth_column: BIRTHDAY
      population_gestational_age_column: GA
      population_child_cpr_column: CPR_BARN
      population_mother_cpr_column: CPR_MOR
    action: exclude
  # induction SP continued
  - function: match_value_with_child_cpr_on_birth_id
    args:
      value: ["Vaginal, igangsat", "Vaginal, igangsat (Udgået)"]
      operator: "=="
      value_table_path: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
      value_column: Måde
      value_table_birth_id_column: BABY_Fødsel_ID
      mapping_table_path: ${paths.input_dir_SP}/Population.csv
      mapping_table_birth_id_column: BABY_Fødsel_ID
      mapping_table_child_cpr_column: BABY_CPR
    action: exclude
  # Remove multiple (twin etc.) births
  - function: find_multiple_births
    args: 
      table: ${paths.input_dir_SDS}/nyfoedte.csv
      match_on: CPRnummer_Barn
      birth_id_column: DW_EK_Foedsel
    action: exclude
  - function: find_multiple_births
    args: 
      table: ${paths.input_dir_SDS}/mfr.csv
      match_on: CPR_BARN
      birth_id_column: FOEDSELSLOEBENUMMER
    action: exclude
  # Remove close pregnancies
  - function: find_close_births
    args:
      table: ${paths.input_dir_SDS}/nyfoedte.csv
      match_on: CPRnummer_Barn
      mom_column: CPRnummer_Mor
      birth_id_column: DW_EK_Foedsel
      delivery_date_column: FoedselsDato_Barn
      threshold_days: 280
    action: exclude
  - function: find_close_births
    args:
      table: ${paths.input_dir_SDS}/mfr.csv
      match_on: CPR_BARN
      mom_column: CPR_MODER
      birth_id_column: FOEDSELSLOEBENUMMER
      delivery_date_column: FOEDSELSDATO
      threshold_days: 280
    action: exclude
    

