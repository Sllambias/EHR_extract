# @package _global_
# time_window on standard conditions: child diagnoses on contacts starting 0-28 days after birth, or later.
# Synthetic barn_kontakter dates are random relative to birth, so only a few contacts fall in the 0-28 day window.
defaults:
  - /default@
  - _self_

paths:
  input_dir_SDS: /Users/zcr545/Desktop/Projects/repos/ehr2meds/data/raw/fetal_data/SDS_AND_SP_from_population
  output_dir: /Users/zcr545/Desktop/Projects/repos/EHR_extract/outputs/populations/${hydra:job.config_name}
  population_save_path: ${paths.output_dir}/${hydra:job.config_name}_population
  discards_save_path: ${paths.output_dir}/${hydra:job.config_name}_discards
  holdout_csv: null

strict: True

population:
  population_key: CPR_BARN
  split_key: CPR_MOR
  deduplication_key: CPR_BARN
  tables:
    - table: ${paths.input_dir_SDS}/nyfoedte.csv
      columns:
        CPR_BARN: CPRnummer_Barn
        CPR_MOR: CPRnummer_Mor
        GA: Gestationsalder
        BIRTHDAY: FoedselsDato_Barn

time_conditionals:
  birth_to_day_28:
    min_date: {date_col: BIRTHDAY, offset_days: 0}
    max_date: {date_col: BIRTHDAY, offset_days: 28}
  after_day_28:
    min_date: {date_col: BIRTHDAY, offset_days: 29}
    max_date: {date_col: null, offset_days: 0}

conditional_criteria:
  # NEC (DP77) on a contact starting 0-28 days after birth
  - action: add_column
    name: nec_by_day_28
    conditions:
      - standard:
        table: &child_contacts
          table1: ${paths.input_dir_SDS}/barn_kontakter.csv
          table2: ${paths.input_dir_SDS}/nyfoedte.csv
          left_on: DW_EK_Nyfoedt
          right_on: DW_EK_Nyfoedt
        match_on: CPRnummer_Barn
        column: Aktionsdiagnose
        operator: startswith_any
        value: [DP77]
        date_col: Datostart
        time_window: birth_to_day_28
  # NEC on a contact starting after day 28
  - action: add_column
    name: nec_after_day_28
    conditions:
      - standard:
        table: *child_contacts
        match_on: CPRnummer_Barn
        column: Aktionsdiagnose
        operator: startswith_any
        value: [DP77]
        date_col: Datostart
        time_window: after_day_28
  # Start date of the latest contact 0-28 days after birth, empty otherwise
  - action: add_column
    name: contact_start_by_day_28
    conditions:
      - standard:
        table: *child_contacts
        match_on: CPRnummer_Barn
        retrieve: Datostart
        date_col: Datostart
        time_window: birth_to_day_28
  # Drop children with ICH (DP52) 0-28 days after birth
  - action: exclude
    conditions:
      - standard:
        table: *child_contacts
        match_on: CPRnummer_Barn
        column: Aktionsdiagnose
        operator: startswith_any
        value: [DP52]
        date_col: Datostart
        time_window: birth_to_day_28
