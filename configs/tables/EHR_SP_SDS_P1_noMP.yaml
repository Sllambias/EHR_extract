#         table: 
#           table1: ${paths.input_dir_SDS}/kejsersnit.csv
#           table2: ${paths.input_dir_SDS}/mfr.csv
#           left_on: FK_MFR
#           right_on: PK_MFR
#         match_on: CPR_BARN
#         column: SKSKODE
#         operator: "startswith"
#         value: "KMCA"
#         date_col: FOEDSELSDATO

  # labor induction
  - name: current_induced_labor
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition: 
        table: 
          table1: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [BABY_Fødsel_ID]
          right_on: [BABY_Fødsel_ID]
        match_on: BABY_CPR
        column: "Måde"
        operator: "startswith"
        value: ["Vaginal, igangsat", "Vaginal, igangsat (Udgået)"]
        date_col: Fødselstidspunkt
      - condition: or
        table:
          table1: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: ProcedureCode
        operator: "in"
        value: ["KMAC00", "KMAC96A", "BKHD2", "BKHD20"]
        date_col: ServiceDate
      - condition: or
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DO837", "DO847"]
        date_col: Noteret_dato
      - condition: or
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: MARKOER_IGANGSAETTELSE
        operator: "=="
        value: "1"
        date_col: FOEDSELSDATO
      - condition: or
        table: 
          table1: ${paths.input_dir_SDS}/igangsaettelse.csv
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: FK_MFR
          right_on: PK_MFR
        match_on: CPR_BARN
        column: SKSKODE
        operator: "startswith"
        value: ["KMAC", "BKHD"]
        date_col: FOEDSELSDATO
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Igangsaettelse_Ballonkateter
        operator: "=="
        value: "Ja"
        date_col: FoedselsDato_Barn
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Igangsaettelse_Medicinsk
        operator: "=="
        value: "Ja"
        date_col: FoedselsDato_Barn
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Igangsaettelse_HSP
        operator: "=="
        value: "Ja"
        date_col: FoedselsDato_Barn
custom_extract_criteria:
  ### Maternal characteristics
  - name: alcohol_consumption
    time_window: before_and_during_pregnancy
    function: extract_latest_value
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - Patientinfo tillæg til CPMI.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: "Alkohol - Antal ugentlige genstande"
      new_col_name: alcohol_consumption
      date_col: "Dato for seneste opdatering"
      dtype: string
  - name: smoking_status
    time_window: before_and_during_pregnancy
    function: extract_latest_value
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - Patientinfo tillæg til CPMI.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Rygestatus
      new_col_name: smoking_status
      date_col: "Dato for seneste opdatering"
      dtype: string
  ### Obstetric history
  - name: parity
    time_window: during_pregnancy
    function: extract_filtered_values
    args: 
      table: 
        table1: ${paths.input_dir_SP}/Mor - Obstetrisk Historik DEL 1.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Para
      new_col_name: current_parity
      date_col: "Kontakt dato"
      filters: 
        - column: Para 
          operator: "not_null"
          value: null
      dtype: string
  ### Cervical conditions
  # cervical length
  - name: current_cervical_length
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
        table: 
          table1: ${paths.input_dir_SP}/Mor - Yderligere variable vurderingsskema.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        left_on: b_cpr
        right_on: BABY_CPR
        target_col: Værdi 
        new_col_name: current_cervical_length
        date_col: Registreringstidspunkt
        filters: 
          - column: Registrering
            operator: "=="
            value: "Cervix i mm"
        dtype: float

  - name: current_hcg
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - CPMI - Prøvesvar.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Resultatværdi
      new_col_name: current_hcg
      date_col: Resultatdato
      filters:
        - column: BestOrd
          operator: "in"
          value: ["HCG (DOUBLETEST);P"]
      dtype: float
  - name: current_papp
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - CPMI - Prøvesvar.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Resultatværdi
      new_col_name: current_papp
      date_col: Resultatdato
      filters:
        - column: BestOrd
          operator: "in"
          value: ["PAPP A (DOUBLETEST);P"]
      dtype: float
  - name: lab_bmi
    time_window: two_years_before_pregnancy
    function: extract_filtered_values
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - CPMI - Vital parametre.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Værdi
      new_col_name: lab_bmi
      date_col: Registreringstidspunkt
      filters:
        - column: Vital_parametre
          operator: "startswith"
          value: ["BMI"]
      dtype: float

  - name: current_hcg_lab_dat
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
      left_on: b_cpr
      new_col_name: current_hcg_lab_dat
      dtype: float
      sources:
        - table:
            table1: ${paths.input_dir_SDS}/lab_dm_forsker_1.csv
            table2: ${paths.input_dir_SDS}/nyfoedte.csv
            left_on: [PATIENT_CPR]
            right_on: [CPRnummer_Mor]
          right_on: CPRnummer_Barn
          target_col: ANALYSISCODE
          date_col: VALUE
          filters:
            - column: ANALYSISCODE
              operator: "startswith"
              value: ["NPU01580"]
        - table:
            table1: ${paths.input_dir_SDS}/lab_dm_forsker_1.csv
            table2: ${paths.input_dir_SDS}/mfr.csv
            left_on: [PATIENT_CPR]
            right_on: [CPR_MODER]
          right_on: CPR_BARN
          target_col: ANALYSISCODE
          date_col: VALUE
          filters:
            - column: BestOrd
              operator: "startswith"
              value: ["NPU01580"]
  - name: current_papp_lab_dat
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
      left_on: b_cpr
      new_col_name: current_papp_lab_dat
      dtype: float
      sources:
        - table:
            table1: ${paths.input_dir_SDS}/lab_dm_forsker_1.csv
            table2: ${paths.input_dir_SDS}/nyfoedte.csv
            left_on: [PATIENT_CPR]
            right_on: [CPRnummer_Mor]
          right_on: CPRnummer_Barn
          target_col: ANALYSISCODE
          date_col: VALUE
          filters:
            - column: ANALYSISCODE
              operator: "startswith"
              value: ["NPU21725", "NPU27780", "NPU22157"]
        - table:
            table1: ${paths.input_dir_SDS}/lab_dm_forsker_1.csv
            table2: ${paths.input_dir_SDS}/mfr.csv
            left_on: [PATIENT_CPR]
            right_on: [CPR_MODER]
          right_on: CPR_BARN
          target_col: ANALYSISCODE
          date_col: VALUE
          filters:
            - column: ANALYSISCODE
              operator: "startswith"
              value: ["NPU21725", "NPU27780", "NPU22157"]
