paths:
  input_dir_SDS: ${oc.env:EHR_EXTRACT_DATA}/SDS/registers_pseudonymized
  input_dir_SP: ${oc.env:EHR_EXTRACT_DATA}/SP/tables
  population: outputs/populations/full_population.json
  output_dir: outputs/tables
  table_save_path: ${paths.output_dir}/table_${hydra:job.config_name}.csv
  summary_save_path: ${paths.output_dir}/summary_${hydra:job.config_name}.csv
  discards_save_path: ${paths.output_dir}/discards_${hydra:job.config_name}.json

strict: True 

summary_table: 
  make_table: True
  ignore_columns: [b_cpr, m_cpr, pregnancy_end, pregnancy_start]
  n_samples: 100000

base_table: 
  population: ${paths.population}
  population_column: b_cpr
  tables:
    - table: ${paths.input_dir_SDS}/mfr.csv
      columns: {CPR_MODER: m_cpr, FOEDSELSDATO: pregnancy_end, GESTATIONSALDER_DAGE: GA_days, CPR_BARN: b_cpr}
    - table: ${paths.input_dir_SDS}/nyfoedte.csv
      columns: {CPRnummer_Mor: m_cpr, CPRnummer_Barn: b_cpr, Gestationsalder: GA_days, FoedselsDato_Barn: pregnancy_end}
  key_columns: [b_cpr, m_cpr, GA_days, pregnancy_end]
  dtypes: {b_cpr: string, m_cpr: string, GA_days: string, pregnancy_end: date}
  add_columns:
    - column: pregnancy_start
      function: find_pregnancy_start
      args:
        birth_date_col: pregnancy_end
        GA_days_col: GA_days
        pregnancy_start_col: pregnancy_start
      dtype: date
    - column: GA_weeks
      function: find_GA_weeks
      args:
        GA_days_col: GA_days
        GA_weeks_col: GA_weeks
      dtype: integer

time_conditionals:
  before_pregnancy:
    min_date:
      date_col: null
      offset_days: 0
    max_date:
      date_col: pregnancy_start
      offset_days: -1
  during_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: 0
    max_date:
      date_col: pregnancy_end
      offset_days: 0
  year_before_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: -365
    max_date:
      date_col: pregnancy_start
      offset_days: 0
  before_and_during_pregnancy:
    min_date:
      date_col: null
      offset_days: 0
    max_date:
      date_col: pregnancy_end
      offset_days: 0
  year_before_pregnancy_and_during_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: -365
    max_date:
      date_col: pregnancy_end
      offset_days: 0
  two_years_before_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: -730
    max_date:
      date_col: pregnancy_start
      offset_days: 0
  six_months_before_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: -180
    max_date:
      date_col: pregnancy_start
      offset_days: 0


extract_criteria:
  - name: ethnicity
    key_column: m_cpr
    sources:
      - table: ${paths.input_dir_SDS}/indvandrer_efterkommer.csv
        match_on: V_PNR
        column: oprindelses_land_tekst
        date_col: gen # just to make it work
    dtype: string
  - name: maternal_age
    key_column: b_cpr
    sources:
      - table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: ALDER_MODER
        date_col: FOEDSELSDATO
      - table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Alder_Mor
        date_col: FoedselsDato_Barn
    dtype: integer
  - name: maternal_BMI
    key_column: b_cpr
    sources:
      - table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: BMI_MODER
        date_col: FOEDSELSDATO
      - table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: BMI_Mor
        date_col: FoedselsDato_Barn
    dtype: float
  - name: smoking_status
    key_column: b_cpr
    sources:
      - table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: RYGERSTATUS_MODER
        date_col: FOEDSELSDATO
      - table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Tobaksforbrug
        date_col: FoedselsDato_Barn
    dtype: string
  - name: parity
    key_column: b_cpr
    sources:
      - table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: PARITET
        date_col: FOEDSELSDATO
      - table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Paritet
        date_col: FoedselsDato_Barn
    dtype: string

conditional_bool_criteria:
  ### Maternal characteristics
  - name: fertility_treatment
    key_column: b_cpr
    match_on: m_cpr
    time_window: year_before_pregnancy_and_during_pregnancy
    conditions:
      - condition: 
        table: 
          table1: ${paths.input_dir_SDS}/ivf_behandlingsforloeb.csv
          table2: ${paths.input_dir_SDS}/nyfoedte.csv
          left_on: CPRnummer
          right_on: CPRnummer_Mor
        match_on: CPRnummer
        column: Graviditet
        operator: "=="
        value: "Ja"
        date_col: Transferering_dato
      - condition: or
        table: 
          table1: ${paths.input_dir_SDS}/ivf_behandlingsforloeb.csv
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: CPRnummer
          right_on: CPR_MODER
        match_on: CPRnummer
        column: Graviditet
        operator: "=="
        value: "Ja"
        date_col: Transferering_dato
  ### Obstetric history
  - name: pcos
    key_column: b_cpr
    match_on: m_cpr
    time_window: before_and_during_pregnancy
    conditions:
      - condition: 
        table:
          table1: ${paths.input_dir_SDS}/mor_diagnoser.csv
          table2: ${paths.input_dir_SDS}/nyfoedte.csv
          left_on: DW_EK_Foedsel
          right_on: DW_EK_Foedsel
        match_on: CPRnummer_Mor
        column: DiagnoseKode
        operator: "in"
        value: ["DE282"]
        date_col: StartDato_Kontakt
      - condition: or
        table:
          table1: 
            table1: ${paths.input_dir_SDS}/t_diag.csv
            table2: ${paths.input_dir_SDS}/t_adm.csv
            left_on: V_RECNUM
            right_on: K_RECNUM
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: V_CPR
          right_on: CPR_MODER
        match_on: V_CPR
        column: C_DIAG
        operator: "in"
        value: ["DE282"]
        date_col: D_INDDTO
  - name: endometriose
    key_column: b_cpr
    match_on: m_cpr
    time_window: before_and_during_pregnancy
    conditions:
      - condition: 
        table:
          table1: ${paths.input_dir_SDS}/mor_diagnoser.csv
          table2: ${paths.input_dir_SDS}/nyfoedte.csv
          left_on: DW_EK_Foedsel
          right_on: DW_EK_Foedsel
        match_on: CPRnummer_Mor
        column: DiagnoseKode
        operator: "startswith"
        value: ["DN80"]
        date_col: StartDato_Kontakt
      - condition: or
        table:
          table1: 
            table1: ${paths.input_dir_SDS}/t_diag.csv
            table2: ${paths.input_dir_SDS}/t_adm.csv
            left_on: V_RECNUM
            right_on: K_RECNUM
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: V_CPR
          right_on: CPR_MODER
        match_on: V_CPR
        column: C_DIAG
        operator: "startswith"
        value: ["DN80"]
        date_col: D_INDDTO
  - name: sleep_disorder
    key_column: b_cpr
    match_on: m_cpr
    time_window: before_and_during_pregnancy
    conditions:
      - condition: 
        table:
          table1: ${paths.input_dir_SDS}/mor_diagnoser.csv
          table2: ${paths.input_dir_SDS}/nyfoedte.csv
          left_on: DW_EK_Foedsel
          right_on: DW_EK_Foedsel
        match_on: CPRnummer_Mor
        column: DiagnoseKode
        operator: "in"
        value: ["DG473", "DG4730", "DG4732", "DG4734"]
        date_col: StartDato_Kontakt
      - condition: or
        table:
          table1: 
            table1: ${paths.input_dir_SDS}/t_diag.csv
            table2: ${paths.input_dir_SDS}/t_adm.csv
            left_on: V_RECNUM
            right_on: K_RECNUM
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: V_CPR
          right_on: CPR_MODER
        match_on: V_CPR
        column: C_DIAG
        operator: "in"
        value: ["DG473", "DG4730", "DG4732", "DG4734"]
        date_col: D_INDDTO
  - name: previous_surgical_abortion
    key_column: b_cpr
    match_on: m_cpr
    time_window: before_pregnancy
    conditions:
      - condition: 
        table:
          table1: ${paths.input_dir_SDS}/mor_procedurer.csv # maybe not correct
          table2: ${paths.input_dir_SDS}/nyfoedte.csv
          left_on: DW_EK_Foedsel
          right_on: DW_EK_Foedsel
        match_on: CPRnummer_Barn
        column: ProcedureKode
        operator: "startswith"
        value: ["KLCH00", "KLCH03"]
        date_col: FoedselsDato_Barn
      - condition: or
        table:
          table1: 
            table1: ${paths.input_dir_SDS}/t_afl.csv
            table2: ${paths.input_dir_SDS}/t_adm.csv
            left_on: V_RECNUM
            right_on: K_RECNUM
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: V_CPR
          right_on: CPR_MODER
        match_on: V_CPR
        column: C_TILOPR
        operator: "in"
        value: ["KLCH00", "KLCH03"]
        date_col: D_ODTO

  - name: previous_spontaneous_abortion
