      - condition: or
        table:
          table1: 
            table1: ${paths.input_dir_SDS}/t_diag.csv
            table2: ${paths.input_dir_SDS}/t_adm.csv
            left_on: V_RECNUM
            right_on: K_RECNUM
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: V_CPR
          right_on: CPR_MODER
        match_on: V_CPR
        column: C_DIAG
        operator: "startswith"
        value: ["DN80"]
        date_col: D_UDDTO

  - name: previous_surgical_abortion
    key_column: b_cpr
    match_on: m_cpr
    time_window: before_and_during_pregnancy_to_cutoff
    conditions:
      - condition: 
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: MOR_CPR
        column: ProcedureCode
        operator: "in"
