paths:
  input_dir_SDS: ${oc.env:EHR_EXTRACT_DATA}/SDS/registers_pseudonymized
  input_dir_SP: ${oc.env:EHR_EXTRACT_DATA}/SP/tables
  population: outputs/populations/full_population.json
  output_dir: outputs/tables
  table_save_path: ${paths.output_dir}/table_${hydra:job.config_name}.csv
  summary_save_path: ${paths.output_dir}/summary_${hydra:job.config_name}.csv
  discards_save_path: ${paths.output_dir}/discards_${hydra:job.config_name}.json

strict: True 

summary_table: 
  make_table: True
  ignore_columns: [b_cpr, m_cpr, pregnancy_end, pregnancy_start]
  n_samples: 100000

base_table: 
  population: ${paths.population}
  population_column: b_cpr
  tables:
    - table: ../../../common/populations/preterm/preterm_P1_noMP_34_img_v6/preterm_P1_noMP_34_img_v6_population_train_and_test.csv #subpops/preterm_37_v5.yaml/preterm_37_v5.yaml_population_train_and_test.csv #../../data/img_data_link/ptb_population/preterm_P1_noMP_v4/preterm_P1_noMP_v4_population_train_and_test.csv
      columns: {CPR_MOR: m_cpr, CPR_BARN: b_cpr, BIRTHDAY: pregnancy_end, GA: GA_days, STUDY_DATE: scan_date}
  key_columns: [b_cpr, m_cpr, GA_days, pregnancy_end, scan_date]
  dtypes: {b_cpr: string, m_cpr: string, GA_days: integer, pregnancy_end: date, scan_date: date}
  add_columns:
    - column: pregnancy_start
      function: find_pregnancy_start
      args:
        birth_date_col: pregnancy_end
        GA_days_col: GA_days
        pregnancy_start_col: pregnancy_start
      dtype: date
    - column: GA_196_date
      function: find_date_at_GA
      args:
        birth_date_col: pregnancy_end
        GA_days_col: GA_days
        GA_number: 196
        date_col: GA_196_date
      dtype: date

time_conditionals:
  during_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: 0
    max_date:
      date_col: pregnancy_end
      offset_days: 0
  before_pregnancy:
    min_date:
      date_col: null
      offset_days: 0
    max_date:
      date_col: pregnancy_start
      offset_days: -1
  during_pregnancy_to_cutoff:
    min_date:
      date_col: pregnancy_start
      offset_days: 0
    max_date:
      date_col: GA_196_date
      offset_days: 0
  before_and_during_pregnancy_to_cutoff:
    min_date:
      date_col: null
      offset_days: 0
    max_date:
      date_col: GA_196_date
      offset_days: 0
  during_pregnancy_to_scan_date:
    min_date:
      date_col: pregnancy_start
      offset_days: 0
    max_date:
      date_col: scan_date
      offset_days: 0
  before_and_during_pregnancy_to_scan_date:
    min_date:
      date_col: null
      offset_days: 0
    max_date:
      date_col: scan_date
      offset_days: 0
  two_years_prior_to_pregnancy_to_cutoff:
    min_date:
      date_col: pregnancy_start
      offset_days: -730
    max_date:
      date_col: GA_196_date
      offset_days: 0
  two_years_prior_to_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: -730
    max_date:
      date_col: pregnancy_start
      offset_days: 0
  five_years_prior_to_pregnancy_to_cutoff:
    min_date:
      date_col: pregnancy_start
      offset_days: -1825
    max_date:
      date_col: GA_196_date
      offset_days: 0


extract_criteria:
  ### Maternal characteristics
  - name: ethnicity
    key_column: m_cpr
    sources:
      - table: ${paths.input_dir_SP}/Mor - Patientinfo tillæg til CPMI.csv
        match_on: MOR_CPR
        column: Etnicitet
        date_col: "Dato for seneste opdatering"
    dtype: string
  - name: maternal_BMI
    key_column: b_cpr
    sources:
      - table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: BMI_MODER
        date_col: FOEDSELSDATO
      - table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: BMI_Mor
        date_col: FoedselsDato_Barn
    dtype: float
  - name: maternal_age
    key_column: b_cpr
    sources:
      - table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: ALDER_MODER
        date_col: FOEDSELSDATO
      - table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Alder_Mor
        date_col: FoedselsDato_Barn
    dtype: integer
  - name: smoking_status
    key_column: b_cpr
    sources:
      - table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: RYGERSTATUS_MODER
        date_col: FOEDSELSDATO
      - table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Tobaksforbrug
        date_col: FoedselsDato_Barn
    dtype: string

conditional_bool_criteria:
  - name: fertility_treatment_2_years_prior
    key_column: b_cpr
    match_on: m_cpr
    time_window: two_years_prior_to_pregnancy_to_cutoff
    conditions:
      - condition: 
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: MOR_CPR
        column: ProcedureCode
        operator: "startswith"
        value: ["BJFL0", "BJFL3", "BBHG31", "BBHG38", "KLCA30", "KLCA31"]
        date_col: ServiceDate
      - condition: or
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: MOR_CPR
        column: Diagnosekode
        operator: "in"
        value: ["DZ311", "DZ312", "DZ313", "DZ319", "DZ321E", "DZ321F", "DZ321G", "DZ321H", 
                "DZ321K", "DZ358F", "DZ358H", "DO003B"] 
        date_col: Noteret_dato
      - condition: or
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: MOR_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DZ318"]
        date_col: Noteret_dato
      # - condition: or
      #   table: 
      #     table1: ${paths.input_dir_SDS}/ivf_behandlingsforloeb.csv
      #     table2: ${paths.input_dir_SDS}/nyfoedte.csv
      #     left_on: CPRnummer
      #     right_on: CPRnummer_Mor
      #   match_on: CPRnummer
      #   column: Graviditet
      #   operator: "=="
      #   value: "Ja"
      #   date_col: Transferering_dato
      # - condition: or
      #   table: 
      #     table1: ${paths.input_dir_SDS}/ivf_behandlingsforloeb.csv
      #     table2: ${paths.input_dir_SDS}/mfr.csv
      #     left_on: CPRnummer
      #     right_on: CPR_MODER
      #   match_on: CPRnummer
      #   column: Graviditet
      #   operator: "=="
      #   value: "Ja"
      #   date_col: Transferering_dato
      - condition: or
        table:
          table1: ${paths.input_dir_SDS}/mor_diagnoser.csv
          table2: ${paths.input_dir_SDS}/nyfoedte.csv
          left_on: DW_EK_Foedsel
          right_on: DW_EK_Foedsel
        match_on: CPRnummer_Mor
        column: DiagnoseKode
        operator: "in"
        value: ["DZ311", "DZ312", "DZ313", "DZ319", "DZ321E", "DZ321F", "DZ321G", "DZ321H", 
                "DZ321K", "DZ358F", "DZ358H", "DO003B"] 
        date_col: StartDato_Kontakt
      - condition: or
        table:
          table1: ${paths.input_dir_SDS}/mor_diagnoser.csv
          table2: ${paths.input_dir_SDS}/nyfoedte.csv
          left_on: DW_EK_Foedsel
          right_on: DW_EK_Foedsel
        match_on: CPRnummer_Mor
        column: DiagnoseKode
        operator: "startswith"
        value: ["DZ318"]
        date_col: StartDato_Kontakt
      - condition: or
        table:
          table1: 
            table1: ${paths.input_dir_SDS}/t_diag.csv
            table2: ${paths.input_dir_SDS}/t_adm.csv
            left_on: V_RECNUM
            right_on: K_RECNUM
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: V_CPR
          right_on: CPR_MODER
        match_on: V_CPR
        column: C_DIAG
        operator: "in"
        value: ["DZ311", "DZ312", "DZ313", "DZ319", "DZ321E", "DZ321F", "DZ321G", "DZ321H", 
                "DZ321K", "DZ358F", "DZ358H", "DO003B"] 
        date_col: D_UDDTO
      - condition: or
        table:
          table1: 
            table1: ${paths.input_dir_SDS}/t_diag.csv
            table2: ${paths.input_dir_SDS}/t_adm.csv
            left_on: V_RECNUM
            right_on: K_RECNUM
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: V_CPR
          right_on: CPR_MODER
        match_on: V_CPR
        column: C_DIAG
        operator: "startswith"
        value: ["DZ318"]
        date_col: D_UDDTO
      - condition: or
        table:
          table1: ${paths.input_dir_SDS}/mor_procedurer.csv # maybe not correct
          table2: ${paths.input_dir_SDS}/nyfoedte.csv
          left_on: DW_EK_Foedsel
          right_on: DW_EK_Foedsel
        match_on: CPRnummer_Barn
        column: ProcedureKode
        operator: "startswith"
        value: ["BJFL0", "BJFL3", "BBHG31", "BBHG38", "KLCA30", "KLCA31"]
        date_col: FoedselsDato_Barn
      - condition: or
        table:
          table1: 
            table1: ${paths.input_dir_SDS}/t_sksube.csv
            table2: ${paths.input_dir_SDS}/t_adm.csv
            left_on: V_RECNUM
            right_on: K_RECNUM
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: V_CPR
          right_on: CPR_MODER
        match_on: V_CPR
        column: C_OPR
        operator: "startswith"
        value: ["BJFL0", "BJFL3", "BBHG31", "BBHG38"]
        date_col: D_ODTO
      - condition: or
        table:
          table1: 
            table1: ${paths.input_dir_SDS}/t_sksopr.csv
            table2: ${paths.input_dir_SDS}/t_adm.csv
            left_on: V_RECNUM
            right_on: K_RECNUM
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: V_CPR
          right_on: CPR_MODER
        match_on: V_CPR
        column: C_OPR
        operator: "startswith"
        value: ["KLCA30", "KLCA31"]
        date_col: D_ODTO

  ### Obstetric history
  - name: pcos
    key_column: b_cpr
    match_on: m_cpr
    time_window: before_and_during_pregnancy_to_cutoff
    conditions:
