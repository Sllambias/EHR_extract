          right_on: [MOR_CPR]
        match_on: MOR_CPR
        column: Diagnosekode
        operator: "in"
        value: ["DZ351A"]
        date_col: Noteret_dato
      - condition: or
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_MODER
        column: GESTATIONSALDER_DAGE
        operator: "between"
        value: [84, 153]
        date_col: FOEDSELSDATO
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Mor
        column: Gestationsalder
        operator: "between"
        value: [84, 153]
        date_col: FoedselsDato_Barn
      - condition: or
        table:
          table1: ${paths.input_dir_SDS}/mor_diagnoser.csv
          table2: ${paths.input_dir_SDS}/nyfoedte.csv
          left_on: DW_EK_Foedsel
          right_on: DW_EK_Foedsel
        match_on: CPRnummer_Mor
        column: DiagnoseKode
        operator: "in"
        value: ["DZ351A"]
        date_col: StartDato_Kontakt
      - condition: or
        table:
          table1: 
            table1: ${paths.input_dir_SDS}/t_diag.csv
            table2: ${paths.input_dir_SDS}/t_adm.csv
            left_on: V_RECNUM
            right_on: K_RECNUM
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: V_CPR
          right_on: CPR_MODER
        match_on: V_CPR
        column: C_DIAG
        operator: "in"
        value: ["DZ351A"]
        date_col: D_UDDTO

  # cervical conization
  - name: cervical_conization
    key_column: b_cpr
    match_on: b_cpr
    time_window: before_and_during_pregnancy_to_cutoff
    conditions:
      - condition: 
        table:
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
