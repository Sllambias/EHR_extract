custom_extract_criteria:
  - name: lab_bmi
    time_window: two_years_prior_to_pregnancy
    function: extract_filtered_values
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - CPMI - Vital parametre.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Værdi
      new_col_name: lab_bmi
      date_col: Registreringstidspunkt
      filters:
        - column: Vital_parametre
          operator: "startswith"
          value: ["BMI"]
      dtype: float
  - name: current_hcg_SP
    time_window: during_pregnancy_to_scan_date
    function: extract_filtered_values
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - CPMI - Prøvesvar.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Resultatværdi
      new_col_name: current_hcg
      date_col: Resultatdato
      filters:
