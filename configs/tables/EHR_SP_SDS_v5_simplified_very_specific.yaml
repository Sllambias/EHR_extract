          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DO30"]
        date_col: Noteret_dato
      - condition: or
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: FLERFOLDSGRAVIDITET
        operator: "startswith"
        value: "DO30"
        date_col: FOEDSELSDATO

  - name: current_multiple_pregnancies_DO31
    key_column: b_cpr
