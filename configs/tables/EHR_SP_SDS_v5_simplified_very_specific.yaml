#   ### Exclusion criteria

  # C-section
  - name: current_c_section
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition: 
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: ProcedureCode
        operator: "startswith"
        value: ["KMCA"]
        date_col: ServiceDate
      - condition: or
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: MARKOER_KEJSERSNIT
        operator: "=="
        value: "1"
        date_col: FOEDSELSDATO
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Kejsersnit
        operator: "!="
        value: "-1"
        date_col: FoedselsDato_Barn
      - condition: or
        table: 
          table1: ${paths.input_dir_SDS}/kejsersnit.csv
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: FK_MFR
          right_on: PK_MFR
        match_on: CPR_BARN
        column: SKSKODE
        operator: "startswith"
        value: "KMCA"
        date_col: FOEDSELSDATO

  # labor induction
  # Todo include ATC codes MG02AD06
  - name: current_induced_labor
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition: 
        table: 
          table1: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [BABY_Fødsel_ID]
          right_on: [BABY_Fødsel_ID]
        match_on: BABY_CPR
        column: "Måde"
        operator: "startswith"
        value: ["Vaginal, igangsat", "Vaginal, igangsat (Udgået)"]
        date_col: Fødselstidspunkt
      - condition: or
        table:
          table1: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: ProcedureCode
        operator: "in"
        value: ["KMAC00", "KMAC96A", "KMAC96B", "BKHD2", "BKHD20"]
        date_col: ServiceDate
      - condition: or
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DO837", "DO847"]
        date_col: Noteret_dato
      - condition: or
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: MARKOER_IGANGSAETTELSE
        operator: "=="
        value: "1"
        date_col: FOEDSELSDATO
      - condition: or
        table: 
          table1: ${paths.input_dir_SDS}/igangsaettelse.csv
          table2: ${paths.input_dir_SDS}/mfr.csv
          left_on: FK_MFR
          right_on: PK_MFR
        match_on: CPR_BARN
        column: SKSKODE
        operator: "startswith"
        value: ["KMAC", "BKHD"]
        date_col: FOEDSELSDATO
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Igangsaettelse_Ballonkateter
        operator: "=="
        value: "Ja"
        date_col: FoedselsDato_Barn
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Igangsaettelse_Medicinsk
        operator: "=="
        value: "Ja"
        date_col: FoedselsDato_Barn
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Igangsaettelse_HSP
        operator: "=="
        value: "Ja"
        date_col: FoedselsDato_Barn
