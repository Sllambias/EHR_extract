    key_column: b_cpr
    match_on: m_cpr
    time_window: before_and_during_pregnancy #year_before_pregnancy_and_during_pregnancy
    conditions:
      - condition: 
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: MOR_CPR
        column: ProcedureCode
        operator: "startswith"
