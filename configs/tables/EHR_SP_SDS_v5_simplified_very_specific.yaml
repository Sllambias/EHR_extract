        operator: "startswith"
        value: ["DO31"]
        date_col: Noteret_dato

  - name: current_multiple_pregnancies
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition: 
        table: 
            table1: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
            table2: ${paths.input_dir_SP}/Population.csv
            left_on: [BABY_Fødsel_ID]
            right_on: [BABY_Fødsel_ID]
        match_on: BABY_CPR
        column: "Foster nr."
        operator: "in"
        value: ["Foster 2", "Foster 3", "Foster 4"]
        date_col: Fødselstidspunkt
      - condition: or
        table: 
          table1: ${paths.input_dir_SP}/Mor - Obstetrisk Historik DEL 1.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Flerfold
        operator: ">="
        value: 1
        date_col: "Kontakt dato"
      - condition: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: AntalBoernIFoedslen
        operator: ">"
        value: 1
        date_col: FoedselsDato_Barn

