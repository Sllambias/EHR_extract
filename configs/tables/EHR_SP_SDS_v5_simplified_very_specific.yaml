  ### Obstetric history
  - name: parity
    time_window: during_pregnancy
    function: extract_filtered_values
    args: 
      table: 
        table1: ${paths.input_dir_SP}/Mor - Obstetrisk Historik DEL 1.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Para
      new_col_name: current_parity
      date_col: "Kontakt dato"
      filters: 
        - column: Para 
          operator: "not_null"
          value: null
      dtype: string
  ### Cervical conditions
  # cervical length
  - name: current_cervical_length
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
        table: 
          table1: ${paths.input_dir_SP}/Mor - Yderligere variable vurderingsskema.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        left_on: b_cpr
        right_on: BABY_CPR
        target_col: Værdi 
        new_col_name: current_cervical_length
        date_col: Registreringstidspunkt
        filters: 
          - column: Registrering
            operator: "=="
            value: "Cervix i mm"
        dtype: float

  - name: current_hcg
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - CPMI - Prøvesvar.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Resultatværdi
      new_col_name: current_hcg
      date_col: Resultatdato
      filters:
        - column: BestOrd
          operator: "in"
          value: ["HCG (DOUBLETEST);P"]
      dtype: float
  - name: current_papp
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - CPMI - Prøvesvar.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Resultatværdi
      new_col_name: current_papp
      date_col: Resultatdato
      filters:
        - column: BestOrd
          operator: "in"
          value: ["PAPP A (DOUBLETEST);P"]
      dtype: float
  - name: lab_bmi
    time_window: two_years_before_pregnancy
    function: extract_filtered_values
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - CPMI - Vital parametre.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Værdi
      new_col_name: lab_bmi
      date_col: Registreringstidspunkt
      filters:
        - column: Vital_parametre
          operator: "startswith"
          value: ["BMI"]
      dtype: float

  - name: current_hcg_lab_dat
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
      left_on: b_cpr
      new_col_name: current_hcg_lab_dat
      dtype: float
      sources:
        - table:
            table1: ${paths.input_dir_SDS}/lab_dm_forsker_1.csv
            table2: ${paths.input_dir_SDS}/nyfoedte.csv
            left_on: [PATIENT_CPR]
            right_on: [CPRnummer_Mor]
          right_on: CPRnummer_Barn
          target_col: VALUE
          date_col: SAMPLINGDATE
          filters:
            - column: ANALYSISCODE
              operator: "startswith"
              value: ["NPU01580"]
        - table:
            table1: ${paths.input_dir_SDS}/lab_dm_forsker_1.csv
            table2: ${paths.input_dir_SDS}/mfr.csv
            left_on: [PATIENT_CPR]
