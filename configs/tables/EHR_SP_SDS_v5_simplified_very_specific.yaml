paths:
  input_dir_SDS: ${oc.env:EHR_EXTRACT_DATA}/SDS/registers_pseudonymized
  input_dir_SP: ${oc.env:EHR_EXTRACT_DATA}/SP/tables
  population: outputs/populations/full_population.json
  output_dir: outputs/tables
  table_save_path: ${paths.output_dir}/table_${hydra:job.config_name}.csv
  summary_save_path: ${paths.output_dir}/summary_${hydra:job.config_name}.csv
  discards_save_path: ${paths.output_dir}/discards_${hydra:job.config_name}.json

strict: True 

summary_table: 
  make_table: True
  ignore_columns: [b_cpr, m_cpr, pregnancy_end, pregnancy_start]
  n_samples: 100000

base_table: 
  population: ${paths.population}
  population_column: b_cpr
  tables:
    - table: subpops/preterm_37_v5.yaml/preterm_37_v5.yaml_population_train_and_test.csv #../../data/img_data_link/ptb_population/preterm_P1_noMP_v4/preterm_P1_noMP_v4_population_train_and_test.csv
      columns: {CPR_MOR: m_cpr, CPR_BARN: b_cpr, BIRTHDAY: pregnancy_end, GA: GA_days}
  key_columns: [b_cpr, m_cpr, GA_days, pregnancy_end]
  dtypes: {b_cpr: string, m_cpr: string, GA_days: integer, pregnancy_end: date}
  add_columns:
    - column: pregnancy_start
      function: find_pregnancy_start
      args:
        birth_date_col: pregnancy_end
        GA_days_col: GA_days
        pregnancy_start_col: pregnancy_start
      dtype: date
    - column: GA_140_date
      function: find_date_at_GA
      args:
        birth_date_col: pregnancy_end
        GA_days_col: GA_days
        GA_number: 140
        date_col: GA_140_date
      dtype: date
    # - column: GA_study_date
    #   function: find_GA_at_date
    #   args:
    #     birth_date_col: pregnancy_end
    #     GA_days_col: GA_days
    #     study_date_col: study_date
    #     GA_at_date_col: GA_study_date
    #   dtype: integer
    # - column: maternal_age
    #   function: find_maternal_age
    #   args:
    #     m_table_path: 
    #       table1: ${paths.input_dir_SP}/Population.csv
    #       table2: ${paths.input_dir_SP}/Mor - CPMI - Patientinfo.csv
    #       left_on: [MOR_CPR]
    #       right_on: [MOR_CPR]
    #     maternal_birth_date_col: Fødselsdato
    #     maternal_id_col: MOR_CPR
    #     baby_birth_date_col: pregnancy_start
    #     key_column: b_cpr
    #     maternal_age_col: maternal_age
    #   dtype: integer

time_conditionals:
  before_pregnancy:
    min_date:
      date_col: null
      offset_days: 0
    max_date:
      date_col: pregnancy_start
      offset_days: -1
  during_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: 0
    max_date:
      date_col: GA_140_date
      offset_days: 0
  before_and_during_pregnancy:
    min_date:
      date_col: null
      offset_days: 0
    max_date:
      date_col: GA_140_date
      offset_days: 0
  year_before_pregnancy_and_during_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: -365
    max_date:
      date_col: GA_140_date
      offset_days: 0
  two_years_before_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: -730
    max_date:
      date_col: pregnancy_start
      offset_days: 0
  six_months_before_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: -180
    max_date:
      date_col: pregnancy_start
      offset_days: 0


extract_criteria:
  ### Maternal characteristics
  - name: ethnicity
    key_column: m_cpr
    sources:
      - table: ${paths.input_dir_SP}/Mor - Patientinfo tillæg til CPMI.csv
        match_on: MOR_CPR
        column: Etnicitet
        date_col: "Dato for seneste opdatering"
    dtype: string
  - name: maternal_BMI
    key_column: b_cpr
    sources:
      - table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: BMI_MODER
        date_col: FOEDSELSDATO
      - table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: BMI_Mor
        date_col: FoedselsDato_Barn
    dtype: float
    # vægt fra vitale_parametre. 

  - name: maternal_age_SDS
    key_column: b_cpr
    sources:
      - table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: ALDER_MODER
        date_col: FOEDSELSDATO
      - table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Alder_Mor
        date_col: FoedselsDato_Barn
    dtype: integer

