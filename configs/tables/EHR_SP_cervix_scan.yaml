          left_on: [BABY_Fødsel_ID]
          right_on: [BABY_Fødsel_ID]
        match_on: BABY_CPR
        column: Køn
        operator: "in"
        value: ["Kvinde"]
        date_col: Fødselstidspunkt

  - name: current_multiple_pregnancies
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition:
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DO30", "DO31"]
        date_col: Noteret_dato
      - condition: or
        table: 
            table1: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
            table2: ${paths.input_dir_SP}/Population.csv
            left_on: [BABY_Fødsel_ID]
            right_on: [BABY_Fødsel_ID]
        match_on: BABY_CPR
        column: "Foster nr."
        operator: "in"
        value: ["Foster 2", "Foster 3", "Foster 4"]
        date_col: Fødselstidspunkt
      - condition: or
        table: 
          table1: ${paths.input_dir_SP}/Mor - Obstetrisk Historik DEL 1.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Flerfold
        operator: ">="
        value: 1
        date_col: "Kontakt dato"
  # uterine malformation
  - name: current_uterine_malformation
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition:
        table:  
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DO340", "DQ518", "DQ519", "DQ51"]
        date_col: Noteret_dato
  # fibroids 
  - name: current_fibroids
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition: 
        table:
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
