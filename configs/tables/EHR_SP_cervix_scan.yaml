        operator: "startswith"
        value: ["DZ358Q", "DO144", "DO141", "DO140", "DO139", "DO14", "DO13"]
        date_col: Noteret_dato
  # vaginal bleeding
  - name: current_vaginal_bleeding
    key_column: b_cpr
