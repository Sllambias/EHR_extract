          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DO468A", "DO209", "DO208", "DO208A", "DO20", "DO46"]
        date_col: Noteret_dato
  # infection 
  - name: current_infection
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition: 
        table:
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DN390A", "DN390", "DA499", "DB349", "DZ038A", "DO234", "DO233", "DO235", "DO239"]
        date_col: Noteret_dato
  # pprom
  - name: current_pprom        
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition:
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DO422", "DO420", "DO424", "DO423"]
        date_col: Noteret_dato
  # maternal comorbidity 
  - name: current_maternal_comorbidity
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition:
        table:  
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DO998", "DO101", "DZ038O", "DO103", "DO992", "DO993B", "DO994", 
                       "DO102", "DO993", "DO996A", "DO991", "DO995", "DO993A", "DO997", 
                       "DO996", "DO989", "DO988", "DO987", "DO983", "DO985", "DO269", 
                       "DO268", "DO266"]
        date_col: Noteret_dato

#   ### Exclusion criteria
  # C-section
  - name: current_c_section
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition:
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: ProcedureCode
        operator: "startswith"
        value: ["KMCA"]
        date_col: ServiceDate
  # labor induction
  - name: current_induced_labor
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition:
        table: 
          table1: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [BABY_Fødsel_ID]
          right_on: [BABY_Fødsel_ID]
        match_on: BABY_CPR
        column: "Måde"
        operator: "startswith"
        value: ["Vaginal, igangsat", "Vaginal, igangsat (Udgået)"]
        date_col: Fødselstidspunkt
      - condition: 
        table:
          table1: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: ProcedureCode
        operator: "in"
        value: ["KMAC00", "KMAC96A", "BKHD2", "BKHD20"]
        date_col: ServiceDate
      - condition: or 
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DO837", "DO847"]
        date_col: Noteret_dato

custom_extract_criteria:
  ### Maternal characteristics
  - name: alcohol_consumption
    time_window: before_and_during_pregnancy
    function: extract_latest_value
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - Patientinfo tillæg til CPMI.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: "Alkohol - Antal ugentlige genstande"
      new_col_name: alcohol_consumption
      date_col: "Dato for seneste opdatering"
      dtype: string
  - name: smoking_status
    time_window: before_and_during_pregnancy
    function: extract_latest_value
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - Patientinfo tillæg til CPMI.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Rygestatus
      new_col_name: smoking_status
      date_col: "Dato for seneste opdatering"
      dtype: string
  ### Obstetric history
  - name: parity
    time_window: during_pregnancy
    function: extract_filtered_values
    args: 
      table: 
        table1: ${paths.input_dir_SP}/Mor - Obstetrisk Historik DEL 1.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Para
      new_col_name: current_parity
      date_col: "Kontakt dato"
      filters: 
        - column: Para 
          operator: "not_null"
          value: null
      dtype: string
  ### Cervical conditions
  # cervical length
  - name: current_cervical_length
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
        table: 
          table1: ${paths.input_dir_SP}/Mor - Yderligere variable vurderingsskema.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        left_on: b_cpr
        right_on: BABY_CPR
        target_col: Værdi 
        new_col_name: current_cervical_length
        date_col: Registreringstidspunkt
        filters: 
          - column: Registrering
            operator: "=="
            value: "Cervix i mm"
        dtype: float

  - name: current_hcg
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - CPMI - Prøvesvar.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Resultatværdi
      new_col_name: current_hcg
      date_col: Resultatdato
      filters:
        - column: BestOrd
          operator: "in"
          value: ["HCG (DOUBLETEST);P"]
      dtype: float
  - name: current_papp
    time_window: during_pregnancy
    function: extract_filtered_values
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - CPMI - Prøvesvar.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Resultatværdi
      new_col_name: current_papp
      date_col: Resultatdato
      filters:
        - column: BestOrd
          operator: "in"
          value: ["PAPP A (DOUBLETEST);P"]
      dtype: float
  - name: lab_bmi
    time_window: two_years_before_pregnancy
    function: extract_filtered_values
    args:
      table: 
        table1: ${paths.input_dir_SP}/Mor - CPMI - Vital parametre.csv
        table2: ${paths.input_dir_SP}/Population.csv
        left_on: [MOR_CPR]
        right_on: [MOR_CPR]
      left_on: b_cpr
      right_on: BABY_CPR
      target_col: Værdi
      new_col_name: lab_bmi
      date_col: Registreringstidspunkt
      filters:
        - column: Vital_parametre
          operator: "startswith"
          value: ["BMI"]
      dtype: float

