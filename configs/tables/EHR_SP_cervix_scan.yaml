paths:
  input_dir_SDS: ${oc.env:EHR_EXTRACT_DATA}/SDS/registers_pseudonymized
  input_dir_SP: ${oc.env:EHR_EXTRACT_DATA}/SP/tables
  population: outputs/populations/full_population.json
  output_dir: outputs/tables
  table_save_path: ${paths.output_dir}/table_${hydra:job.config_name}.csv
  summary_save_path: ${paths.output_dir}/summary_${hydra:job.config_name}.csv
  discards_save_path: ${paths.output_dir}/discards_${hydra:job.config_name}.json

strict: True 

summary_table: 
  make_table: True
  ignore_columns: [b_cpr, m_cpr, pregnancy_end, pregnancy_start]
  n_samples: 100000

base_table: 
  population: ${paths.population}
  population_column: b_cpr
  tables:
    - table: ../../data/img_data_link/ptb_population/cervix_imgs/preterm_NGC_population_train_and_test.csv
      columns: {CPR_MOR: m_cpr, CPR_BARN: b_cpr, BIRTHDAY: pregnancy_end, GA: GA_days, STUDY_DATE: scan_date}
  key_columns: [b_cpr, m_cpr, GA_days, pregnancy_end, scan_date]
  dtypes: {b_cpr: string, m_cpr: string, GA_days: integer, pregnancy_end: date, scan_date: date}
  add_columns:
    - column: pregnancy_start
      function: find_pregnancy_start
      args:
        birth_date_col: pregnancy_end
        GA_days_col: GA_days
        pregnancy_start_col: pregnancy_start
      dtype: date
    - column: GA_140_date
      function: find_date_at_GA
      args:
        birth_date_col: pregnancy_end
        GA_days_col: GA_days
        GA_number: 140
        date_col: GA_140_date
      dtype: date
    - column: maternal_age
      function: find_maternal_age
      args:
        m_table_path: 
          table1: ${paths.input_dir_SP}/Population.csv
          table2: ${paths.input_dir_SP}/Mor - CPMI - Patientinfo.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        maternal_birth_date_col: Fødselsdato
        maternal_id_col: MOR_CPR
        baby_birth_date_col: pregnancy_start
        key_column: b_cpr
        maternal_age_col: maternal_age
      dtype: integer

time_conditionals:
  before_pregnancy:
    min_date:
      date_col: null
      offset_days: 0
    max_date:
      date_col: pregnancy_start
      offset_days: -1
  during_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: 0
    max_date:
      date_col: scan_date
      offset_days: 0
  before_and_during_pregnancy:
    min_date:
      date_col: null
      offset_days: 0
    max_date:
      date_col: scan_date
      offset_days: 0
  year_before_pregnancy_and_during_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: -365
    max_date:
      date_col: scan_date
      offset_days: 0
  two_years_before_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: -730
    max_date:
      date_col: pregnancy_start
      offset_days: 0
  six_months_before_pregnancy:
    min_date:
      date_col: pregnancy_start
      offset_days: -180
    max_date:
      date_col: pregnancy_start
      offset_days: 0


extract_criteria:
  ### Maternal characteristics
  - name: ethnicity
    key_column: m_cpr
    sources:
      - table: ${paths.input_dir_SP}/Mor - Patientinfo tillæg til CPMI.csv
        match_on: MOR_CPR
        column: Etnicitet
        date_col: "Dato for seneste opdatering"
    dtype: string
  - name: maternal_BMI
    key_column: b_cpr
    sources:
      - table: 
          table1: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [BABY_Fødsel_ID]
          right_on: [BABY_Fødsel_ID]
        match_on: BABY_CPR
        column: "Vægt før graviditet"
        date_col: Fødselstidspunkt
    dtype: float
    ## vægt fra vitale_parametre. 

conditional_bool_criteria:
  ### Maternal characteristics
  - name: smoking_status
    key_column: b_cpr
    match_on: m_cpr
    time_window: before_and_during_pregnancy
    conditions:
      - condition:
        table:  
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["BKUA32"]
        date_col: Noteret_dato
  - name: drug_use
    key_column: b_cpr
    match_on: m_cpr
    time_window: before_and_during_pregnancy
    conditions:
      - condition:
        table:  
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: BABY_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DZ358M1", "DZ358M2", "DZ358M3", "DZ3931", "DZ3932"]
        date_col: Noteret_dato
  - name: fertility_treatment
    key_column: b_cpr
    match_on: m_cpr
    time_window: year_before_pregnancy_and_during_pregnancy
    conditions:
      - condition:
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: MOR_CPR
        column: ProcedureCode
        operator: "startswith"
        value: ["BBHG38", "BJFL0", "AFV01G"]
        date_col: ServiceDate
      - condition: or
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: MOR_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DZ314", "DZ318", "DZ319"] # fertility treatment
        date_col: Noteret_dato
      - condition: or
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: MOR_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DO003B", "DZ321H", "DZ358F"] # IVF pregnancy
        date_col: Noteret_dato
  - name: pcos
    key_column: b_cpr
    match_on: m_cpr
    time_window: before_and_during_pregnancy
    conditions:
      - condition:
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: MOR_CPR
        column: Diagnosekode
        operator: "in"
        value: ["DE282"]
        date_col: Noteret_dato
  - name: endometriose
    key_column: b_cpr
    match_on: m_cpr
    time_window: before_and_during_pregnancy
    conditions:
      - condition:
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: MOR_CPR
        column: Diagnosekode
        operator: "startswith"
        value: ["DN80"]
        date_col: Noteret_dato
  - name: sleep_disorder
    key_column: b_cpr
    match_on: m_cpr
    time_window: before_and_during_pregnancy
    conditions:
      - condition:
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          table2: ${paths.input_dir_SP}/Population.csv
          left_on: [MOR_CPR]
          right_on: [MOR_CPR]
        match_on: MOR_CPR
        column: Diagnosekode
        operator: "in"
        value: ["DG473", "DG4730", "DG4732", "DG4734"]
        date_col: Noteret_dato
  - name: previous_surgical_abortion
    key_column: b_cpr
    match_on: m_cpr
    time_window: before_pregnancy
    conditions:
      - condition:
        table: 
          table1: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          table2: ${paths.input_dir_SP}/Population.csv
