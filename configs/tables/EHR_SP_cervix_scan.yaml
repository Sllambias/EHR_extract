#   ### Current pregnancy (mechanical)
  # multiple pregnancies
  - name: female_fetus
    key_column: b_cpr
    match_on: b_cpr
    time_window: during_pregnancy
    conditions:
      - condition:
        table: 
          table1: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
