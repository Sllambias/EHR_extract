  - name: marker_post_partum_bleeding
    time_window: at_birth
    function: extract_filtered_values
    args:
      left_on: CPR_BARN
      new_col_name: marker_post_partum_bleeding
      dtype: string
      table: ${paths.input_dir_SDS}/mfr.csv
      right_on: CPR_BARN
