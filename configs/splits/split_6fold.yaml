# @package _global_
defaults:
  - /default
  - _self_

paths:
  input_dir_SDS: /storage/archive/UCPH/DeepFetal/SDS/registers_pseudonymized
  input_dir_SP: /storage/archive/UCPH/DeepFetal/SP/tables
  output_dir: /projects/users/data/UCPH/DeepFetal/projects/common/splits/${hydra:job.config_name}
  img_sequence_predictions: /projects/users/data/UCPH/DeepFetal/projects/common/cervix_classification/cervix_preds_v3.csv
  imaging_table: /projects/users/data/UCPH/DeepFetal/ultrasound/tables/database_snapshots/all_images_2026-06-23.csv

custom_split_fn: kfold 

population: 
  folds: 6
  population_key: CPR_MOR
  tables: 
    - table: ${paths.input_dir_SDS}/mfr.csv
      columns:
        CPR_MOR: CPR_MODER
    - table: ${paths.input_dir_SDS}/nyfoedte.csv
      columns:
        CPR_MOR: CPRnummer_Mor
    - table: ${paths.input_dir_SP}/Population.csv
      columns:
        CPR_MOR: MOR_CPR
    - table: ${paths.imaging_table}
      columns:
        CPR_MOR: phair_hash

holdout_frac: 0.0
seed: 95021



