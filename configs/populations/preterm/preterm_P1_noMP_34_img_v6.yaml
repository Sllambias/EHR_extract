# @package _global_
defaults:
  - /default@
  - _self_

paths:
  input_dir_SDS: /storage/archive/UCPH/DeepFetal/SDS/registers_pseudonymized
  input_dir_SP: /storage/archive/UCPH/DeepFetal/SP/tables
  output_dir: ${oc.env:EHR_EXTRACT_OUTPUTS}/${hydra:job.config_name}
  population_save_path: ${paths.output_dir}/${hydra:job.config_name}_population
  discards_save_path: ${paths.output_dir}/${hydra:job.config_name}_discards
  holdout_csv: /projects/users/data/UCPH/DeepFetal/projects/common/splits/split_V4/test_split_0.15_2026-06-08.csv
  img_sequence_predictions: /projects/users/data/UCPH/DeepFetal/projects/common/cervix_classification/cervix_preds_v3.csv
  imaging_table: /projects/users/data/UCPH/DeepFetal/ultrasound/tables/database_snapshots/all_images_2026-08-24.csv

strict: True
preterm_cutoff: 238

population: 
  population_key: CPR_BARN
  split_key: CPR_MOR
  file_path_key: FILE_PATH
  deduplication_key: CPR_BARN
  tables: 
    - table: ${paths.input_dir_SDS}/mfr.csv
      columns:
        CPR_BARN: CPR_BARN
        CPR_MOR: CPR_MODER
        GA: GESTATIONSALDER_DAGE
        BIRTHDAY: FOEDSELSDATO
    - table: ${paths.input_dir_SDS}/nyfoedte.csv
      columns:
        CPR_BARN: CPRnummer_Barn
        CPR_MOR: CPRnummer_Mor
        GA: Gestationsalder
        BIRTHDAY: FoedselsDato_Barn
  composed_tables:
    - merge_on: CPR_BARN
      format_SP_GA: True
      tables:
        - table: ${paths.input_dir_SP}/Population.csv
          columns:
            CPR_BARN: BABY_CPR
            CPR_MOR: MOR_CPR
            BIRTHDAY: Fødselstidspunkt
        - table: ${paths.input_dir_SP}/Barn - Fødselsinfo.csv
          columns:
            CPR_BARN: BABY_CPR
            GA: Gestationsalder

conditional_criteria:
  # GA available at birth
  - action: exclude
    conditions: 
      - standard: 
        table: population
        match_on: CPR_BARN
        column: GA
        operator: "missing"
        value: 
  # Only live birth (no SP)
  - action: exclude
    conditions:
      - standard: 
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: LEVENDE_ELLER_DOEDFOEDT
        operator: "!="
        value: Levendefødt
      - standard: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: LevendefoedtDoedfoedt
        operator: "!="
        value: "1"
  # No C-section/kejsersnit unless PPROM or Contractions or C-section during birth
  - action: exclude
    conditions:
      - standard:
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Kejsersnit
        operator: "!="
        value: "-1"
      - standard: and
        table: population
        match_on: CPR_BARN
        column: GA
        operator: <
        value: ${preterm_cutoff}
      - custom: and 
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/mor_diagnoser.csv
          value_column: DiagnoseKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      - custom: and 
