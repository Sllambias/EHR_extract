# @package _global_
defaults:
  - /default@
  - _self_

paths:
  input_dir_SDS: /storage/archive/UCPH/DeepFetal/SDS/registers_pseudonymized
  input_dir_SP: /storage/archive/UCPH/DeepFetal/SP/tables
  output_dir: ${oc.env:EHR_EXTRACT_OUTPUTS}/populations/preterm/${hydra:job.config_name}
  population_save_path: ${paths.output_dir}/${hydra:job.config_name}_population
  discards_save_path: ${paths.output_dir}/${hydra:job.config_name}_discards
  holdout_csv: /projects/users/data/UCPH/DeepFetal/projects/common/splits/split_V4-1/test_split_0.15_2026-11-16.csv

strict: True
write_parquet: True
# Written as YYYY-MM-DD
date_columns: [BIRTHDAY]

population: 
  population_key: CPR_BARN
  split_key: CPR_MOR
  file_path_key: FILE_PATH
  deduplication_key: CPR_BARN
  tables: 
    - table: ${paths.input_dir_SDS}/mfr.csv
      columns:
        CPR_BARN: CPR_BARN
        CPR_MOR: CPR_MODER
        GA: GESTATIONSALDER_DAGE
        BIRTHDAY: FOEDSELSDATO
    - table: ${paths.input_dir_SDS}/nyfoedte.csv
      columns:
        CPR_BARN: CPRnummer_Barn
        CPR_MOR: CPRnummer_Mor
        GA: Gestationsalder
        BIRTHDAY: FoedselsDato_Barn
  composed_tables:
    - merge_on: CPR_BARN
      format_SP_GA: True
      tables:
        - table: ${paths.input_dir_SP}/Population.csv
          columns:
            CPR_BARN: BABY_CPR
            CPR_MOR: MOR_CPR
            BIRTHDAY: Fødselstidspunkt
        - table: ${paths.input_dir_SP}/Barn - Fødselsinfo.csv
          columns:
            CPR_BARN: BABY_CPR
            GA: Gestationsalder

conditional_criteria:
  # Child has a valid CPR
  - action: exclude
    conditions:
      - standard:
        table: population
        match_on: CPR_BARN
        column: CPR_BARN
        operator: "=="
        value: "INVALID"
  # GA available at birth
  - action: exclude
    conditions: 
      - standard: 
        table: population
        match_on: CPR_BARN
        column: GA
        operator: "missing"
        value: 
  # Only live birth (no SP)
  - action: exclude
    conditions:
      - standard: 
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: LEVENDE_ELLER_DOEDFOEDT
        operator: "!="
        value: Levendefødt
      - standard: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: LevendefoedtDoedfoedt
        operator: "!="
        value: "1"
      - custom: or
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: Levende
          operator: ["!=", all]
          value_table_path: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
          value_column: "Foetus mortuus "
          value_table_birth_id_column: BABY_Fødsel_ID
          mapping_table_path: ${paths.input_dir_SP}/Population.csv
          mapping_table_birth_id_column: BABY_Fødsel_ID
          mapping_table_child_cpr_column: BABY_CPR
  # Remove close siblings (no SP)
  - action: exclude
    conditions:
      - custom: 
        function: find_close_births
        args:
          value: 280
          operator: <
          table: ${paths.input_dir_SDS}/nyfoedte.csv
          match_on: CPRnummer_Barn
          mom_column: CPRnummer_Mor
          birth_id_column: DW_EK_Foedsel
          delivery_date_column: FoedselsDato_Barn
      - custom: or
        function: find_close_births        
        args:
          value: 280
          operator: <
          table: ${paths.input_dir_SDS}/mfr.csv
          match_on: CPR_BARN
          mom_column: CPR_MODER
          birth_id_column: FOEDSELSLOEBENUMMER
          delivery_date_column: FOEDSELSDATO
  # Not born in 2026 (the prospective cohort's year). Comes after the close-sibling exclusion, which also drops
  # the earlier child of a close pair, so that only the 2026 births themselves are removed
  - action: exclude
    conditions:
      - standard:
        table: population
        match_on: CPR_BARN
        column: BIRTHDAY
        operator: startswith_any
        value: ["2026"]
  # First pregnancy, as a column instead of a filter: True for exactly the births preterm_P1_img_v7 keeps with
  # its "Only first pregnancy" exclusion (every child minus each of that exclusion's four conditions)
  # SDS: 1 = first pregnancy. An empty parity is unknown and counts as first, "." does not.
  # SP: 0 = first pregnancy (but many mistakes so often 1 == first pregnancy as well)
  # SP: not first if any non-missing Para in the pregnancy is 2 or more
  - action: add_column
    name: parity_0
    conditions:
      - standard:
        table: population
        match_on: CPR_BARN
      - standard: and_not
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: PARITET
        operator: "!="
        value: "1"
      - standard: and_not
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Paritet
        operator: "!="
        value: "1"
      - custom: and_not
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: 2
          operator: [">=", any]
          value_table_path: ${paths.input_dir_SP}/Mor - Obstetrisk Historik DEL 1.csv
          value_column: Para
          value_time_column: Kontakt dato
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
      - custom: and_not
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: DZ348A #Flergangsfødende
          operator: ["==", any]
          value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          value_column: Diagnosekode
          value_time_column: Noteret_dato
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
  # C-section/kejsersnit, at any GA, unless PPROM or Contractions or C-section during birth
  - action: add_column
    name: c-section_acute
    conditions:
      - standard:
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Kejsersnit
        operator: "!="
        value: "-1"
      - custom: and_not 
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SDS}/mor_diagnoser.csv
          value_column: DiagnoseKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      - custom: and_not 
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SDS}/mor_procedurer.csv
          value_column: ProcedureKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
