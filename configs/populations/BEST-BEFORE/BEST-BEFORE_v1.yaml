defaults:
  - default@
  - _self_

paths:
  input_dir_SDS: /storage/archive/UCPH/DeepFetal/SDS/registers_pseudonymized
  input_dir_SP: /storage/archive/UCPH/DeepFetal/SP/tables
  output_dir: ${oc.env:EHR_EXTRACT_OUTPUTS}/populations/${hydra:job.config_name}
  population_save_path: ${paths.output_dir}/${hydra:job.config_name}_population
  discards_save_path: ${paths.output_dir}/${hydra:job.config_name}_discards
  distribution_save_path: ${paths.output_dir}/${hydra:job.config_name}_distribution
  holdout_csv: /projects/users/data/UCPH/DeepFetal/projects/common/splits/split_V4/test_split_0.15_2026-06-08.csv
  img_sequence_predictions: /projects/users/people/seblla/test/PN_CompleteV1_cls_outputs.csv
  imaging_table: /projects/users/data/UCPH/DeepFetal/ultrasound/tables/database_snapshots/all_images_2026-08-24.csv

strict: True

population: 
  population_key: CPR_BARN
  split_key: CPR_MOR
  file_path_key: FILE_PATH
  deduplication_key: CPR_BARN
  tables: 
    - table: ${paths.input_dir_SDS}/mfr.csv
      columns:
        CPR_BARN: CPR_BARN
        CPR_MOR: CPR_MODER
        GA: GESTATIONSALDER_DAGE
        BIRTHDAY: FOEDSELSDATO
    - table: ${paths.input_dir_SDS}/nyfoedte.csv
      columns:
        CPR_BARN: CPRnummer_Barn
        CPR_MOR: CPRnummer_Mor
        GA: Gestationsalder
        BIRTHDAY: FoedselsDato_Barn
  composed_tables:
    - merge_on: CPR_BARN
      format_SP_GA: True
      tables:
        - table: ${paths.input_dir_SP}/Population.csv
          columns:
            CPR_BARN: BABY_CPR
            CPR_MOR: MOR_CPR
            BIRTHDAY: Fødselstidspunkt
        - table: ${paths.input_dir_SP}/Barn - Fødselsinfo.csv
          columns:
            CPR_BARN: BABY_CPR
            GA: Gestationsalder

conditional_criteria:
  - action: exclude
    conditions: 
      - standard: 
        table: population
        match_on: CPR_BARN
        column: GA
        operator: ">"
        value: 265
      - standard: or
        table: population
        match_on: CPR_BARN
        column: GA
        operator: "<"
        value: 238


imaging_table:
  table: ${paths.imaging_table}
  columns:
    CPR_MOR: phair_hash
    FILE_PATH: file_path
    STUDY_DATE: study_date
    NO_OCR_FILE_PATH: no_ocr_preprocessed_file_path


imaging_matching_criteria:
  # Filter1: Scan-to-delivery interval
  # Filter2: GA at scan
  - function: find_images_within_time_windows
    args:
      scan_date_column: STUDY_DATE
      image_path_column: ${population.file_path_key}
      population_ga_in_days_at_delivery_column: GA
      population_delivery_date_column: BIRTHDAY
      min_diff_days_scan_to_delivery: 0
      max_diff_days_scan_to_delivery: 350
      min_ga_in_days_at_scan: 0
      max_ga_in_days_at_scan: 350
  # Only Cervix (14)
  - function: find_images_with_predicted_classes
    args:
      table: ${paths.img_sequence_predictions}
      classes: [4,6,10,24,25]
      image_path_column: file_path
      class_column: max_pred
      population_image_path_column: ${population.file_path_key}
