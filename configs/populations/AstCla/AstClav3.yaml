# @package _global_
defaults:
  - /default@
  - _self_

# Spontaneous preterm, singleton, live births with 154 <= GA <= 224.
# Uses the SP conditions of preterm/preterm_P1_v7.yaml, with its c-section_acute, induced_acute
# and multi_birth columns turned into exclusions.
paths:
  input_dir_SP: /storage/archive/UCPH/DeepFetal/SP/tables
  output_dir: ${oc.env:EHR_EXTRACT_OUTPUTS}/populations/AstCla/${hydra:job.config_name}
  population_save_path: ${paths.output_dir}/${hydra:job.config_name}_population
  discards_save_path: ${paths.output_dir}/${hydra:job.config_name}_discards
  distribution_save_path: ${paths.output_dir}/${hydra:job.config_name}_distribution
  holdout_csv: /projects/users/data/UCPH/DeepFetal/projects/common/splits/split_V4-1/test_split_0.15_2026-11-16.csv

strict: True
write_parquet: True
# Written as YYYY-MM-DD
date_columns: [BIRTHDAY]

population:
  population_key: CPR_BARN
  split_key: CPR_MOR
  file_path_key: FILE_PATH
  deduplication_key: CPR_BARN
  composed_tables:
    - merge_on: CPR_BARN
      format_SP_GA: True
      tables:
        - table: ${paths.input_dir_SP}/Population.csv
          columns:
            CPR_BARN: BABY_CPR
            CPR_MOR: MOR_CPR
            BIRTHDAY: Fødselstidspunkt
        - table: ${paths.input_dir_SP}/Barn - Fødselsinfo.csv
          columns:
            CPR_BARN: BABY_CPR
            GA: Gestationsalder

conditional_criteria:
  # Child has a valid CPR
  - action: exclude
    conditions:
      - standard:
        table: population
        match_on: CPR_BARN
        column: CPR_BARN
        operator: "=="
        value: "INVALID"
  # GA available at birth
  - action: exclude
    conditions:
      - standard:
        table: population
        match_on: CPR_BARN
        column: GA
        operator: "missing"
        value:
  # 154 <= GA <= 224
  - action: exclude
    conditions:
      - standard:
        table: population
        match_on: CPR_BARN
        column: GA
        operator: ">"
        value: 224
      - standard: or
        table: population
        match_on: CPR_BARN
        column: GA
        operator: "<"
        value: 154
  # Only births from 2017 until 2026-11-20
  - action: include
    conditions:
      - custom:
        function: match_years_with_child_cpr_on_birthdate
        args:
          date_start: "01012017"
          date_end: "20112026"
          value_table_path: ${paths.input_dir_SP}/Population.csv
          value_time_column: Fødselstidspunkt
          value_child_cpr_column: BABY_CPR
  # Only live birth
  - action: exclude
    conditions:
      - custom:
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: Levende
          operator: ["!=", all]
          value_table_path: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
          value_column: "Foetus mortuus "
          value_table_birth_id_column: BABY_Fødsel_ID
          mapping_table_path: ${paths.input_dir_SP}/Population.csv
          mapping_table_birth_id_column: BABY_Fødsel_ID
          mapping_table_child_cpr_column: BABY_CPR
  # No C-section/kejsersnit, at any GA, unless PPROM or Contractions or C-section during birth
  - action: exclude
    conditions:
      - custom:
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: "KMCA"
          operator: [startswith, any]
          value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          value_column: ProcedureCode
          value_time_column: ServiceDatetime
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
      - custom: and_not
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: [DO420, DO422, DO424, DO601]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          value_column: Diagnosekode
          value_time_column: Noteret_dato
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
      - custom: and_not
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: [KMCA10D, KMCA10E]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          value_column: ProcedureCode
          value_time_column: ServiceDatetime
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
  # Not induced, at any GA, unless PPROM
  - action: exclude
    conditions:
      - custom:
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: ["KMAC00" , "KMAC96A", "BKHD2", "BKHD20"]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Procedurer.csv
          value_column: ProcedureCode
          value_time_column: ServiceDatetime
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
      - custom: and_not
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: [DO420, DO422, DO424]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          value_column: Diagnosekode
          value_time_column: Noteret_dato
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
      - custom: or
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: "DO837"
          operator: [startswith, any]
          value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          value_column: Diagnosekode
          value_time_column: Noteret_dato
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
      - custom: and_not
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: [DO420, DO422, DO424]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          value_column: Diagnosekode
          value_time_column: Noteret_dato
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
      - custom: or
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: "DO847"
          operator: [startswith, any]
          value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          value_column: Diagnosekode
          value_time_column: Noteret_dato
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
      - custom: and_not
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: [DO420, DO422, DO424]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          value_column: Diagnosekode
          value_time_column: Noteret_dato
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
      - custom: or
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: ["Vaginal, igangsat", "Vaginal, igangsat (Udgået)"]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
          value_column: Måde
          value_table_birth_id_column: BABY_Fødsel_ID
          mapping_table_path: ${paths.input_dir_SP}/Population.csv
          mapping_table_birth_id_column: BABY_Fødsel_ID
          mapping_table_child_cpr_column: BABY_CPR
      - custom: and_not
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: [DO420, DO422, DO424]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SP}/Mor - CPMI - Diagnoseliste.csv
          value_column: Diagnosekode
          value_time_column: Noteret_dato
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
  # Remove multiple births (twins etc.)
  - action: exclude
    conditions:
      - custom:
        function: find_duplicated_ids
        args:
          table:
            table1: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
            table2: ${paths.input_dir_SP}/Population.csv
            left_on: BABY_Fødsel_ID
            right_on: BABY_Fødsel_ID
          match_on: BABY_CPR
          id_columns: [MOR_CPR, BABY_Fødsel_ID]
      - custom: or
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: ["Foster 2", "Foster 3", "Foster 4"]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
          value_column: Foster nr.
          value_table_birth_id_column: BABY_Fødsel_ID
          mapping_table_path: ${paths.input_dir_SP}/Population.csv
          mapping_table_birth_id_column: BABY_Fødsel_ID
          mapping_table_child_cpr_column: BABY_CPR
      - custom: or
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: 1
          operator: [">=", any]
          value_table_path: ${paths.input_dir_SP}/Mor - Obstetrisk Historik DEL 1.csv
          value_column: Flerfold
          value_time_column: Kontakt dato
          value_mother_cpr_column: MOR_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
          include_days_after_birth: 7
